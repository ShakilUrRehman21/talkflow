# ===================================================================
# JavaChatApp - Application Configuration
# ===================================================================

spring.application.name=JavaChatApp

# Database Configuration:
# - Local Dev (Default): Embedded H2 File Database (persisted to ./data/chatdb)
# - Cloud Production: Supply SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/chatdb;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (accessible at /h2-console for local inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Dynamic Server Port:
# Cloud hosts (Render, Railway, Heroku) inject $PORT automatically.
# Defaults to 8080 locally.
server.port=${PORT:8080}